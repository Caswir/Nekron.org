<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>CRYPTO ORACLE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#0f0;font-family:'Courier New',monospace;padding:16px;max-width:820px;margin:auto}
h1{text-shadow:0 0 8px #0f0;font-size:1.6rem;margin:8px 0}
.sub{color:#0a0;font-size:.85rem;margin-bottom:16px}
select,button{background:#000;color:#0f0;border:1px solid #0f0;padding:10px 14px;font-family:inherit;font-size:1rem;cursor:pointer}
button:hover{background:#0f0;color:#000}
.box{border:1px solid #0f0;padding:14px;margin-top:16px;box-shadow:0 0 10px #0f03}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #060}
.big{font-size:1.8rem;text-shadow:0 0 8px #0f0}
.bar{height:14px;border:1px solid #0f0;margin-top:6px}
.fill{height:100%;background:#0f0;width:0;transition:width .8s}
canvas{width:100%;height:180px;display:block;margin-top:10px}
.warn{color:#0a0;font-size:.75rem;margin-top:20px}
.cur:after{content:'_';animation:b 1s infinite}
@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<h1>&gt; CRYPTO ORACLE<span class='cur'></span></h1>
<div class='sub'>Technical-analysis predictions from live market data (CoinGecko)</div>
<select id='coin'></select>
<button onclick='run()'>[ ANALYZE ]</button>
<div id='out'></div>
<div class='warn'>DISCLAIMER: Output is a statistical read of past price data, not financial advice. Nobody can reliably predict crypto prices. Never risk money you cannot afford to lose.</div>
<script>
const COINS=[['bitcoin','BTC'],['ethereum','ETH'],['solana','SOL'],['ripple','XRP'],['cardano','ADA'],['dogecoin','DOGE'],['binancecoin','BNB'],['avalanche-2','AVAX'],['chainlink','LINK']];
const sel=document.getElementById('coin');
COINS.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1]+' - '+c[0];sel.appendChild(o)});

const sma=(a,n)=>a.length<n?null:a.slice(-n).reduce((x,y)=>x+y,0)/n;
function emaSeries(a,n){const k=2/(n+1);const r=[a[0]];for(let i=1;i<a.length;i++)r.push(a[i]*k+r[i-1]*(1-k));return r}
function rsi(a,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];d>=0?g+=d:l-=d}g/=n;l/=n;
 for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+(d>0?d:0))/n;l=(l*(n-1)+(d<0?-d:0))/n}
 return l===0?100:100-100/(1+g/l)}
function macd(a){const e12=emaSeries(a,12),e26=emaSeries(a,26);const m=e12.map((v,i)=>v-e26[i]);const s=emaSeries(m,9);return{m:m.at(-1),s:s.at(-1),h:m.at(-1)-s.at(-1)}}
function vol(a){const r=[];for(let i=Math.max(1,a.length-30);i<a.length;i++)r.push(Math.log(a[i]/a[i-1]));const mu=r.reduce((x,y)=>x+y,0)/r.length;return Math.sqrt(r.reduce((x,y)=>x+(y-mu)**2,0)/r.length)}
const fmt=n=>'$'+n.toLocaleString(undefined,{maximumFractionDigits:n<1?5:2});

function analyze(p){
 const last=p.at(-1),s20=sma(p,20),s50=sma(p,50),s200=sma(p,200),R=rsi(p),M=macd(p);
 const mom=(last/p.at(-8)-1)*100;
 let score=0;const sig=[];
 const add=(v,txt)=>{score+=v;sig.push([v,txt])};
 add(last>s50?1:-1,'Price '+(last>s50?'above':'below')+' 50-day average');
 add(s20>s50?1:-1,'20-day average '+(s20>s50?'above':'below')+' 50-day (short-term trend)');
 if(s200)add(last>s200?1:-1,'Price '+(last>s200?'above':'below')+' 200-day average (long-term trend)');
 if(R<30)add(1.5,'RSI '+R.toFixed(1)+': oversold, bounce odds rise');
 else if(R>70)add(-1.5,'RSI '+R.toFixed(1)+': overbought, pullback risk');
 else add((R-50)/25,'RSI '+R.toFixed(1)+': neutral zone');
 add(M.h>0?1:-1,'MACD histogram '+(M.h>0?'positive (bullish momentum)':'negative (bearish momentum)'));
 add(mom>0?.5:-.5,'7-day momentum '+mom.toFixed(1)+'%');
 const max=s200?6:5;
 const dir=score>1.5?'BULLISH':score<-1.5?'BEARISH':'NEUTRAL';
 const conf=Math.min(95,Math.round(Math.abs(score)/max*100));
 const sd=vol(p)*Math.sqrt(7);
 return{last,score,dir,conf,sig,R,lo:last*Math.exp(-sd),hi:last*Math.exp(sd),sd,mom,s20,s50,s200,M,max};
}

function draw(p,a){
 const c=document.getElementById('cv'),x=c.getContext('2d');
 c.width=c.clientWidth*2;c.height=360;
 const d=p.slice(-90),mn=Math.min(...d),mx=Math.max(...d);
 const X=i=>i/(d.length-1)*c.width,Y=v=>c.height-10-(v-mn)/(mx-mn)*(c.height-20);
 x.strokeStyle='#0f0';x.lineWidth=3;x.shadowColor='#0f0';x.shadowBlur=8;x.beginPath();
 d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();
 x.shadowBlur=0;x.strokeStyle='#060';x.lineWidth=2;x.setLineDash([8,8]);
 const s=[];for(let i=0;i<d.length;i++){const w=p.slice(0,p.length-d.length+i+1);s.push(w.length>=50?sma(w,50):null)}
 x.beginPath();let st=false;s.forEach((v,i)=>{if(v==null)return;st?x.lineTo(X(i),Y(v)):(x.moveTo(X(i),Y(v)),st=true)});x.stroke();
}

async function run(){
 const out=document.getElementById('out'),id=sel.value;
 out.innerHTML='<div class="box">&gt; Fetching live data...<span class="cur"></span></div>';
 try{
  const r=await fetch('https://api.coingecko.com/api/v3/coins/'+id+'/market_chart?vs_currency=usd&days=365&interval=daily');
  if(!r.ok)throw new Error(r.status===429?'Rate limit hit. Wait a minute and retry.':'API error '+r.status);
  const j=await r.json();
  const p=j.prices.map(x=>x[1]);
  if(p.length<60)throw new Error('Not enough data for this coin.');
  const a=analyze(p);
  const col=a.dir==='BEARISH'?'#f55':'#0f0';
  out.innerHTML=
  '<div class="box"><div class="row"><span>PRICE</span><span>'+fmt(a.last)+'</span></div>'+
  '<div class="row"><span>7-DAY OUTLOOK</span><span class="big" style="color:'+col+'">'+a.dir+'</span></div>'+
  '<div class="row"><span>INDICATOR AGREEMENT</span><span>'+a.conf+'%</span></div>'+
  '<div class="bar"><div class="fill" id="f"></div></div>'+
  '<div class="row" style="margin-top:10px"><span>LIKELY 7D RANGE (~68%)</span><span>'+fmt(a.lo)+' - '+fmt(a.hi)+'</span></div>'+
  '<div class="row"><span>SCORE</span><span>'+a.score.toFixed(2)+' / '+a.max+'</span></div></div>'+
  '<div class="box"><div>&gt; SIGNALS</div>'+a.sig.map(s=>'<div class="row"><span>'+(s[0]>0?'[+] ':s[0]<0?'[-] ':'[=] ')+s[1]+'</span></div>').join('')+'</div>'+
  '<div class="box"><div>&gt; 90-DAY PRICE (dashed = 50-day avg)</div><canvas id="cv"></canvas></div>'+
  '<div class="box" style="font-size:.8rem">Source: CoinGecko daily closes, 365 days. Agreement % shows how strongly the indicators line up, not the probability of being right. The range uses the last 30 days of volatility.</div>';
  setTimeout(()=>document.getElementById('f').style.width=a.conf+'%',50);
  draw(p,a);
 }catch(e){out.innerHTML='<div class="box" style="color:#f55">&gt; ERROR: '+e.message+'</div>'}
}
run();
</script>
</body>
</html>
