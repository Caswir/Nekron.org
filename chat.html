<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Terminal Chat</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1000px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .top-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .header {
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            margin: 0;
            flex-grow: 1;
            text-align: right;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
        #chat-container {
            height: 450px;
            overflow-y: scroll;
            border: 2px solid #00ff00;
            padding: 15px;
            margin-bottom: 10px;
            word-wrap: break-word;
            word-break: break-word;
            background-color: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            border-radius: 5px;
        }

        /* Scrollbar styling */
        #chat-container::-webkit-scrollbar {
            width: 12px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: #000;
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #00c000;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #input-container {
            margin-top: 5px;
        }
        input, button {
            background-color: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 6px 12px;
            font-family: 'Courier New', monospace;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        input {
            flex-grow: 1;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        button {
            cursor: pointer;
            font-weight: bold;
            min-width: 80px;
            white-space: nowrap;
        }
        button:hover {
            background-color: #00ff00;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .ascii-art {
            color:rgb(255, 136, 0);
            margin: 10px 0;
            white-space: pre;
            font-family: monospace;
            overflow: visible;
            max-width: none;
            display: block;
            line-height: 1;
            font-size: 14px;
            letter-spacing: 0;
            padding: 10px 0;
            text-align: left;
            tab-size: 4;
        }
        .ascii-art pre {
            margin: 0;
            padding: 0;
            white-space: pre;
            font-family: monospace;
            line-height: 1;
            letter-spacing: 0;
            tab-size: 4;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            #chat-container {
                height: 400px;
            }
            .header {
                font-size: 1.2em;
                width: 100%;
                text-align: center;
                margin-bottom: 10px;
            }
            #username-input {
                flex: 1;
                max-width: none;
            }
            .input-group {
                flex-direction: column;
                width: 100%;
            }
            #message-input {
                width: 100%;
            }
            #send-button {
                width: 100%;
            }
            .ascii-art pre {
                font-size: 8px;
            }
        }
        .system-message {
            color: #ff0;
            margin: 5px 0;
            font-style: italic;
        }
        .timestamp {
            color: #888;
        }
        .message {
            margin: 5px 0;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
        }
        #username-container {
            padding: 8px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
            border: 1px solid #00ff00;
            flex-shrink: 0;
            width: auto;
        }
        #username-input {
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div class="top-container">
        <div id="username-container" class="input-group">
            <input type="text" id="username-input" placeholder="Username">
            <button onclick="setUsername()">Join</button>
            <span class="status-text" id="status-text"></span>
        </div>
        <h1 class="header">Hench Messenger</h1>
    </div>
    <div id="chat-container"></div>
    <div id="input-container" class="input-group">
        <input type="text" id="message-input" placeholder="Type your message..." disabled>
        <button onclick="sendMessage()" id="send-button" disabled>Send</button>
    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
  		apiKey: "AIzaSyCW95cYxzWIBRLk_hC4Pujp4oGif2R0zyA",
  		authDomain: "messenger-2ecc7.firebaseapp.com",
  		databaseURL: "https://messenger-2ecc7-default-rtdb.firebaseio.com",
  		projectId: "messenger-2ecc7",

  		messagingSenderId: "431345075115",
  		appId: "1:431345075115:web:7e1be206d0dab7d092c8ee"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase();
        const messagesRef = ref(db, 'messages');

        // ASCII Art definitions
        const ASCII_ART = {

        =++=*++=-===-==-:::::+**==*+=-::---==          
        =+++++++=--::::::::::-==--=*==---------=       
        ==+++++***=::::::::::-====+*+-----------==     
        ==++++++********+====--===+*===----------=    
         ==+++=++*#*******+==-=-====+*==--::::----=+   
          =+*++++**#*****   +========++==--::::---=++

               =             +==----=++**+----==---=++ 
                             +=------=++#*+====++=-==+

            guitar: `

⠀⣿⣿⣿⣿⣦⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠈⠹⣿⣿⣿⣿⣦⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠈⠻⣿⣿⣿⣿⣦⡀⠀⠀⠀⠀⠀⠀⢀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠈⠻⣿⣿⣿⣿⣦⡀⠀⠀⢀⣴⣿⣷⣄⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠈⠻⣿⣿⣿⣿⣦⣴⣿⠟⠉⠻⣿⣷⣄⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠻⣿⣿⣿⣿⡁⠀⠀⠀⠈⠻⣿⣷⣄⠀⣀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣴⣿⠟⠙⢿⣿⣦⡀⠀⠀⠀⠈⠻⣿⣿⣿⣆⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⣴⣿⡟⠁⠀⠀⠀⠙⢿⣿⣆⠀⠀⠠⢾⣿⣿⣿⣿⣆⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠈⠻⣿⣦⡀⠀⠀⠀⠀⠙⢿⣷⣤⡀⠀⠈⠉⠛⠻⢿⡄⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠻⣿⣦⡀⠀⠀⡀⠀⠙⢿⣿⣦⣾⣇⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠻⣿⣦⣾⣷⡀⠀⣠⣿⣿⣿⣿⣆⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢠⣿⣿⣿⣿⣧⠀⠉⠙⠻⢿⣿⣿⡄⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠙⠻⢿⣿⣆⠀⠀⠀⠀⠀⠉⠁⠀⠀⠀
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠉⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀`,
                      cat: `

               :=#@#*..          -#@@#%@#:.              
              -=*@##@%=:.      +*%%#+-+*@@*:.

         ::*@*********%#+@#******************#@*         
         :-@%*#@@@%**#@*+@#***#@@@***********%@+         
         :-@#=%#-#@***#@@#****@+=@%****#@@@#+%@*         
        @@@@*=*@@@#***********@#+@%*=+*%@@@**%@=         
         @@@@++=++**=#@@@@@****@@#*+***@@@#*@@+          
          :=@@****************************#@@+:          
           :-%%#*************************@@%=:           
            ::+@@%**********************@@#::            
             -::=#@@********************#%@@#-:          
            --=#%*********************##****%@@-:        
            -+%#*****************************#%@*::      
           -=%#*******************************+#@#:-     
          --#%************************#*********#@#::    
          -+@**@%*********************@@*********#@+:    
          :%#*#@@**********************@#********#@#-    
          =@**#@%**********************@@*********#%+:   
         :*%**%@#**********************%@#*********%%=   
         						`,
            	labo: `                                                     
                                                     
                                                     
                                                     
                                                     
                   ##             #%                 
                  #%%             %%#                
                #%%*-%#%%#   #%%%%-=%%               
              %*+++#.:#++==+====++.#++%%%            
            %#+++*#+**+++=========+=+%++*%           
           %*+++*#+++++++============+%+*%           
          %%++++%++#++++=+*%#**#%*+*++**%%           
           #%*+**++#*++==+#%*++*#%++==*%%            
             %##++++#*+=*#++****++*#+*##             
              %#======*%++++##*##+++#++#             
               #=====++++*++++#++++++#%#             
              #%+==*+++++*++++%+++++++#%             
             #%-#++%++++++++#%%%*++++++%%            
           %#**#-*=+%*+++*##+.%.##*+++*%             
          %*+++*+=#+=+%*+==+%:.+*=+#%#               
         %*++++++#+*===+*####*###%%                  
       #%+++++++++#=-#====++++++++%#                 
     #**+++++++++++**-**========+*#%

+%+++==============================+%                `
        };

        let username = '';
        let isFirstLoad = true;

        // Load existing messages when the page loads
        onValue(messagesRef, (snapshot) => {
            const chatContainer = document.getElementById('chat-container');
            const data = snapshot.val();
            
            if (data) {
                const messages = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
                
                if (isFirstLoad) {
                    chatContainer.innerHTML = '';
                    messages.forEach(msg => {
                        appendMessage(msg.username, msg.message, msg.type === 'system', msg.timestamp);
                    });
                    isFirstLoad = false;
                } else {
                    // For subsequent updates, only append new messages
                    const lastMessage = messages[messages.length - 1];
                    
                    // Only clear if it's an explicit clear command
                    if (lastMessage.message.includes('Chat cleared') && lastMessage.type === 'system') {
                        chatContainer.innerHTML = '';
                        appendMessage(lastMessage.username, lastMessage.message, true, lastMessage.timestamp);
                    } else {
                        appendMessage(lastMessage.username, lastMessage.message, lastMessage.type === 'system', lastMessage.timestamp);
                    }
                }
            }
        });

        window.setUsername = function() {
            const usernameInput = document.getElementById('username-input');
            const statusText = document.getElementById('status-text');
            if (usernameInput.value.trim()) {
                username = usernameInput.value.trim();
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-button').disabled = false;
                usernameInput.disabled = true;
                statusText.textContent = `Logged in as: ${username}`;
                appendMessage('System', `Welcome, ${username}!`, true);
            }
        };

        window.sendMessage = function() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            
            if (message && username) {
                const timestamp = Date.now();
                
                if (message.toLowerCase() === 'clear messages 666') {
                    // Clear messages from Firebase and add the clear message in one transaction
                    set(messagesRef, {
                        clearMessage: {
                            username: 'System',
                            message: `Chat cleared by ${username}`,
                            timestamp: timestamp,
                            type: 'system'
                        }
                    });
                } else {
                    // Send message to Firebase
                    const messageType = message.toLowerCase().startsWith('draw') ? 'ascii' : 'message';
                    push(messagesRef, {
                        username: username,
                        message: message,
                        timestamp: timestamp,
                        type: messageType
                    });
                }
                messageInput.value = '';
            }
        };

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function createMatrixRain() {
            const canvas = document.createElement('canvas');
            canvas.id = 'matrix-rain';
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.zIndex = '9999';
            canvas.style.pointerEvents = 'none';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const fontSize = 16;
            const columns = Math.floor(canvas.width / fontSize);
            const drops = new Array(columns).fill(1);

            function drawMatrixRain() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00ff00';
                ctx.font = `${fontSize}px monospace`;

                for (let i = 0; i < drops.length; i++) {
                    const text = Math.random() > 0.5 ? '0' : '1';
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            const matrixInterval = setInterval(drawMatrixRain, 50);
            setTimeout(() => {
                clearInterval(matrixInterval);
                document.body.removeChild(canvas);
            }, 10000);
        }

        function appendMessage(user, text, isSystem = false, timestamp = Date.now()) {
            const chatContainer = document.getElementById('chat-container');
            let content = text;
            let className = 'message';

            // Special handling for matrix command
            if (text.trim().toLowerCase() === 'draw matrix') {
                createMatrixRain();
                return; // Prevent adding the message to chat
            }

            // Check for ASCII art commands
            const command = text.toLowerCase();
            if (command === 'draw skull') {
                content = ASCII_ART.skull;
                className = 'ascii-art';
            } else if (command === 'draw demon') {
                content = ASCII_ART.demon;
                className = 'ascii-art';
            } else if (command === 'draw guitar') {
                content = ASCII_ART.guitar;
                className = 'ascii-art';
            } else if (command === 'draw cat') {
                content = ASCII_ART.cat;
                className = 'ascii-art';
            } else if (command === 'draw labo') {
                content = ASCII_ART.labo;
                className = 'ascii-art';
            } else if (isSystem) {
                className = 'system-message';
            }

            const formattedTimestamp = formatTimestamp(timestamp);
            const messageElement = document.createElement('div');
            messageElement.className = className;
            
            if (className === 'ascii-art') {
                const header = document.createElement('div');
                header.innerHTML = `<span class="timestamp">[${formattedTimestamp}]</span> ${user}:`;
                messageElement.appendChild(header);
                
                const art = document.createElement('pre');
                art.textContent = content;
                messageElement.appendChild(art);
            } else {
                messageElement.innerHTML = `<span class="timestamp">[${formattedTimestamp}]</span> ${user}: ${content}`;
            }
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Handle Enter key in message input
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Handle Enter key in username input
        document.getElementById('username-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                setUsername();
            }
        });
    </script>
</body>
</html>
