<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Spectrum Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: black;
            color: limegreen;
            font-family: 'MedievalSharp', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #ADFF2F;
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 5px #006400;
        }

        #analyzer-container {
            width: 500px;
            height: 500px;
            border: 5px solid #32CD32;
            background-color: #0A0A0A;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px #008000;
        }

        #analyzer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            background-color: #228B22;
            color: white;
            border: 2px solid #006400;
            padding: 15px 30px;
            font-family: 'MedievalSharp', cursive;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        button:hover {
            background-color: #3CB371;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 2px 5px rgba(0, 0, 0, 0.5);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #4CAF50;
        }

        input:checked + .slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <h1>Wave Nabber</h1>
    <div id="analyzer-container">
        <canvas id="analyzer-canvas"></canvas>
    </div>
    <div class="controls">
        <button id="startButton">Start Analyzer</button>
        <button id="captureButton">Capture</button>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const captureButton = document.getElementById('captureButton');
        const canvas = document.getElementById('analyzer-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 500;
        canvas.height = 500;

        let audioContext;
        let analyser;
        let microphone;
        let animationFrameId;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        async function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();

                analyser.fftSize = 16384;
                analyser.smoothingTimeConstant = 0.9;
                analyser.minDecibels = -150;
                analyser.maxDecibels = 0;

                microphone = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(microphone);
                source.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                draw(analyser, bufferLength, dataArray);
                startButton.textContent = "Stop Analyzer";

            } catch (err) {
                console.error('Error accessing microphone:', err);
                alert('Could not access microphone. Please ensure permissions are granted.');
                startButton.textContent = "Start Analyzer";
            }
        }

        function stopAudio() {
            if (microphone) {
                microphone.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            startButton.textContent = "Start Analyzer";
        }

        let frameCount = 0;

        function draw(analyser, bufferLength, dataArray) {
            animationFrameId = requestAnimationFrame(() => draw(analyser, bufferLength, dataArray));
            frameCount++;

            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const numLines = 80;
            const lineSpacing = canvas.width / numLines;

            for (let i = 0; i < numLines; i++) {
                const startIndex = Math.floor((i / numLines) * bufferLength);
                const endIndex = Math.min(startIndex + Math.floor(bufferLength / (numLines * 2)), bufferLength);
                let sum = 0;
                for (let j = startIndex; j < endIndex; j++) {
                    sum += dataArray[j];
                }
                let avgValue = (endIndex > startIndex) ? sum / (endIndex - startIndex) : 0;

                let mappedValue = Math.pow(avgValue / 255, 0.3) * 255;
                
                const baseActivity = 20;
                mappedValue = Math.max(mappedValue, baseActivity);

                const x = i * lineSpacing;
                
                ctx.beginPath();
                const intensityFactor = mappedValue / 255;
                ctx.strokeStyle = `rgba(0, 255, 0, ${0.2 + intensityFactor * 0.7})`;
                ctx.lineWidth = 1 + intensityFactor * 2;
                ctx.shadowBlur = 5 * intensityFactor;
                ctx.shadowColor = 'rgba(0, 255, 0, 0.8)';
                
                const waveAmplitude = 5 + intensityFactor * 20;
                const waveFrequency = 0.03;
                const waveOffset = frameCount * 0.03 + i * 0.1;

                ctx.moveTo(x + lineSpacing / 2 + Math.sin(waveOffset) * waveAmplitude * 0.5, 0);
                for (let y = 0; y <= canvas.height; y += 10) {
                    const offsetX = Math.sin((y * waveFrequency) + waveOffset + i * 0.05) * waveAmplitude;
                    ctx.lineTo(x + lineSpacing / 2 + offsetX, y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;

                if (Math.random() < (0.02 + intensityFactor * 0.1)) {
                    const dotRadius = 3 + intensityFactor * 8;
                    const dotX = x + (Math.random() - 0.5) * lineSpacing * 1.5;
                    const dotY = Math.random() * canvas.height;

                    ctx.beginPath();
                    ctx.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(173, 255, 47, ${0.5 + intensityFactor * 0.5})`;
                    ctx.shadowBlur = dotRadius * 3;
                    ctx.shadowColor = 'rgba(0, 255, 47, 0.8)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }
        
        async function startRecording() {
            if (!microphone) {
                alert('Please start the analyzer first to get microphone access.');
                return;
            }

            const canvasStream = canvas.captureStream(60);
            const audioTracks = microphone.getAudioTracks();
            if (audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks[0]);
            }
            
            recordedChunks = [];
            
            let mimeType;
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            } else if (MediaRecorder.isTypeSupported('video/webm')) {
                mimeType = 'video/webm';
            } else {
                alert('Your browser does not support video recording.');
                return;
            }
            
            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: mimeType });
            
            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                document.body.appendChild(a);
                a.style = 'display: none';
                a.href = url;
                a.download = 'spectrum-capture.' + (mimeType === 'video/mp4' ? 'mp4' : 'webm');
                a.click();
                window.URL.revokeObjectURL(url);
            };
            
            mediaRecorder.start();
            isRecording = true;
            captureButton.textContent = 'Stop Capture';
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                captureButton.textContent = 'Capture';
            }
        }

        startButton.addEventListener('click', () => {
            if (audioContext && audioContext.state === 'running') {
                stopAudio();
            } else {
                initAudio();
            }
        });

        captureButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });
    </script>
</body>
</html>
