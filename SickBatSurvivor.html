<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Sick Kitty Survivor</title>         
        <style>
            /* --- Basic Setup (Hacker Theme) --- */
            body, html { 
                margin: 0; 
                padding: 0; 
                overflow: hidden; 
                background-color: #000000;  /* Black background */ 
                font-family: 'Consolas', 'Courier New', monospace;  /* Monospace font for hacker feel */ 
                color: #00ff00;  /* Vibrant green text */ 
                user-select: none; 
                -webkit-user-select: none; /* For iOS Safari */
                touch-action: manipulation; /* Prevent zoom, etc. */
            } 
            #game-world { 
                position: relative; 
                width: 100vw; 
                height: 100vh; 
                background-color: #0d0d0d;  /* Slightly lighter black for game area */ 
                overflow: hidden;  /* For debugging hitboxes */ 
                /* filter: brightness(0.5); */ 
            } 
            
            /* --- Player (now an Image) --- */
            #player { 
                position: absolute; 
                width: 37px; 
                height: 37px;  
                border: none;  /* No border for the image */ 
                box-sizing: border-box; 
                /* MODIFIED: Changed transition to only apply to filter, not transform */
                transition: filter 0.1s linear; 
                z-index: 100; 
                image-rendering: pixelated;  /* Ensures crisp pixels */ 
                filter: drop-shadow(0 0 5px #00ff00);  /* Green glow effect */ 
            } 
            #player.taking-damage { 
                animation: flash-red 0.3s; 
                filter: drop-shadow(0 0 10px #ff0000) invert(100%);  /* Red glow and invert for hit effect */ 
            } 
            @keyframes flash-red { 
                0%, 100% {  filter: drop-shadow(0 0 10px #ff0000) invert(100%); }  /* Red glow on hit */ 
                50% {  filter: drop-shadow(0 0 5px #00ff00); }  /* Briefly return to green */ 
            } 
            
            /* --- Weapons --- */
            #sonar { 
                position: absolute;  /* top/left set by JS to follow player */ 
                transform: translate(-50%, -50%);  /* Center on its position */ 
                border: 2px dashed rgba(0, 255, 0, 0.5);  /* Green dashed border */ 
                background-color: rgba(0, 255, 0, 0.1);  /* Transparent green fill */ 
                border-radius: 50%; 
                z-index: 90; 
                box-sizing: border-box; 
                box-shadow: 0 0 15px rgba(0, 255, 0, 0.7);  /* Stronger green glow */ 
            } 
            .spinning-orb { 
                position: absolute; 
                width: 20px; 
                height: 20px;  
                z-index: 110;  
                image-rendering: pixelated;  
                background-image: url('https://www.nekron.org/pics/orbital.gif'); 
                background-size: contain; 
                background-repeat: no-repeat; 
                filter: drop-shadow(0 0 5px #00ffff);  
            } 
            .flame-weapon { 
                position: absolute;  
                z-index: 105;  
                transform-origin: 0% 50%; 
                image-rendering: pixelated; 
                filter: drop-shadow(0 0 10px #ff6600);  /* Fiery glow */ 
                display: none;  /* Hidden until acquired */ 
            } 
            
            /* --- NEW: Flamethrower Pickup --- */
            .flamethrower-pickup {
                position: absolute;
                width: 40px;
                height: 40px;
                z-index: 76; /* Above other items */
                cursor: pointer;
                filter: drop-shadow(0 0 15px #ff6600); /* Fiery glow */
                image-rendering: pixelated;
                animation: pulse-white 1.0s infinite; /* Reuse pulse */
            }

            /* --- Iceblast Weapon --- */
            .iceblast-shard {
                position: absolute;
                width: 20px; /* From config */
                height: 20px; /* From config */
                z-index: 106; /* Above flame, below orbs */
                image-rendering: pixelated;
                filter: drop-shadow(0 0 10px #00ffff); /* Cyan glow */
            }
            
            /* --- Entities --- */
            .enemy { 
                position: absolute;  
                z-index: 80; 
                filter: drop-shadow(0 0 5px #ff0000);  /* Red glow effect */ 
                image-rendering: pixelated;  /* Keep pixel art crisp */ 
                transition: filter 0.2s ease-out; /* For slow effect */
            } 
            .xp-gem { 
                position: absolute; 
                width: 12px; 
                height: 12px; 
                background-color: #00ffff;  /* Cyan for XP */ 
                border: 2px solid #00cccc; 
                border-radius: 2px;  /* Small squares */ 
                z-index: 70; 
                cursor: pointer; 
                transition: transform 0.2s ease-out; 
                box-shadow: 0 0 8px #00ffff; 
                image-rendering: pixelated; 
            } 
            .xp-gem:hover { 
                transform: scale(1.5); 
            } 
            .xp-boost { 
                position: absolute; 
                width: 40px; 
                height: 40px; 
                z-index: 75;  /* Above gems, below enemies */ 
                cursor: pointer; 
                filter: drop-shadow(0 0 10px #ffffff); 
                image-rendering: pixelated; 
                animation: pulse-white 1.5s infinite; 
            } 
            @keyframes pulse-white { 
                0%, 100% {  transform: scale(1);  opacity: 1; }  
                50% {  transform: scale(1.1);  opacity: 0.8; } 
            } 
            
            /* --- Health Pack --- */
            .health-pack {
                position: absolute;
                width: 40px;
                height: 40px;
                z-index: 75;  
                cursor: pointer;
                filter: drop-shadow(0 0 10px #ff69b4); /* Hot pink glow */
                image-rendering: pixelated;
            }

            /* --- Bom (Uses xp-boost style) --- */
            /* We will reuse the .xp-boost style for the bom */

            /* --- Iceblast Pickup --- */
            .iceblast-pickup {
                position: absolute;
                width: 40px;
                height: 40px;
                z-index: 76; /* Above other items */
                cursor: pointer;
                filter: drop-shadow(0 0 15px #00ffff); /* Strong cyan glow */
                image-rendering: pixelated;
                animation: pulse-white 1.0s infinite; /* Reuse pulse */
            }

            /* --- NEW: Extra Life (Comp) Pickup --- */
            .extra-life-pickup {
                position: absolute;
                width: 42px;
                height: 42px;
                z-index: 77; /* Above other items */
                cursor: pointer;
                filter: drop-shadow(0 0 15px #ffff00); /* Yellow glow */
                image-rendering: pixelated;
                animation: pulse-white 0.8s infinite; /* Faster pulse */
            }

            .damage-number { 
                position: absolute; 
                font-size: 1rem; 
                font-weight: bold; 
                color: #ff0000;  /* Red for damage numbers */ 
                animation: float-up 0.5s ease-out forwards; 
                pointer-events: none; 
                z-index: 200; 
                text-shadow: 0 0 5px #ff0000; 
            } 
            @keyframes float-up { 
                from {  opacity: 1;  transform: translateY(0); }  
                to {  opacity: 0;  transform: translateY(-30px); } 
            } 
            
            /* --- UI Elements --- */
            #ui-container { 
                position: fixed; 
                top: 0; 
                left: 0; 
                width: 100%; 
                padding: 15px; 
                box-sizing: border-box; 
                z-index: 1000; 
            } 
            #stats-bar { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                max-width: 900px; 
                margin: 0 auto; 
                background: rgba(0, 255, 0, 0.1);  /* Transparent green */ 
                padding: 10px; 
                border-radius: 5px;  /* Less rounded */ 
                border: 1px solid #00cc00;  /* Green border */ 
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5); 
            } 
            #timer, #level, #enemy-count { 
                font-size: 1.2rem; 
                font-weight: bold; 
                margin: 0 15px; 
                color: #00ff00; 
                text-shadow: 0 0 5px #00ff00; 
            } 
            
            /* --- Bars --- */
            .bar { 
                width: 30vw; /* Make flexible */
                max-width: 200px; /* Max size */
                min-width: 120px; /* Min size */
                height: 18px;  /* Slightly smaller bars */ 
                background-color: #333333;  /* Dark grey */ 
                border-radius: 3px; 
                overflow: hidden; 
                border: 1px solid #008800;  /* Darker green border */ 
                box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.3); 
            } 
            #xp-bar.boosted { 
                border-color: #00ffff; 
                box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.7), 0 0 15px rgba(0, 255, 255, 0.7); 
            } 
            .bar-label { 
                font-size: 0.8rem; 
                margin-bottom: 4px; 
                color: #00ff00; 
            } 
            #hp-bar-fill { 
                width: 100%; 
                height: 100%; 
                background-color: #00cc00;  /* Bright green HP */ 
                transition: width 0.2s; 
            } 
            #xp-bar-fill { 
                width: 0%; 
                height: 100%; 
                background-color: #00ffff;  /* Cyan XP */ 
                transition: width 0.2s; 
            } 

            /* --- Responsive UI for small screens --- */
            @media (max-width: 600px) {
                #stats-bar {
                    flex-direction: column;
                    padding: 5px;
                }
                .bar {
                    width: 60vw; /* Use viewport width */
                    max-width: 200px; /* But don't go crazy */
                    height: 15px;
                }
                #timer, #level {
                    font-size: 1rem;
                    margin: 2px 10px;
                }
                .bar-label {
                    font-size: 0.7rem;
                }
                .modal p { /* New rule for modal text */
                    font-size: 0.9rem;
                }
            }
            
            /* --- Modals (Start, Level Up, Game Over) --- */
            #modal-container { 
                position: fixed; 
                top: 0; 
                left: 0; 
                width: 100%; 
                height: 100%; 
                background-color: rgba(0, 0, 0, 0.85);  /* More opaque black */ 
                display: flex; 
                justify-content: center; 
                align-items: center; 
                z-index: 2000; 
            } 
            .modal { 
                background-color: #1a1a1a;  /* Dark grey */ 
                border: 2px solid #00ff00;  /* Green border */ 
                padding: 20px; /* Reduced padding for mobile */
                border-radius: 8px;  /* Slightly rounded */ 
                text-align: center; 
                box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);  /* Green glow */ 
                color: #00ff00;  /* Green text */ 
                text-shadow: 0 0 5px #00ff00; 
                max-width: 90%; /* Ensure modal fits on screen */
                box-sizing: border-box;
            } 

            /* --- NEW: Screen Flash --- */
            #screen-flash {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #000; /* Solid black */
                z-index: 9998; /* Below modals (2000), above game (1000) */
                display: none; /* Hidden by default */
                pointer-events: none;
            }

            .hidden { 
                display: none !important; 
            } 
            .modal h1 { 
                margin-top: 0; 
                color: #00ff00; 
                text-shadow: 0 0 8px #00ff00; 
                font-size: 1.5rem; /* Smaller H1 for mobile */
            } 
            .modal button { 
                background-color: #008800;  /* Dark green button */ 
                color: white;  /* White text on buttons for contrast */ 
                border: 1px solid #00ff00;  /* Green button border */ 
                padding: 12px 20px; /* Reduced padding */
                font-size: 1rem; /* Smaller font */
                border-radius: 5px; 
                cursor: pointer; 
                margin: 8px 5px; /* Reduced margin */
                transition: background-color 0.2s, transform 0.1s; 
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); 
                font-family: 'Consolas', 'Courier New', monospace; 
            } 
            .modal button:hover { 
                background-color: #00cc00;  /* Brighter green on hover */ 
                transform: translateY(-2px); 
            } 
            .modal button:active { 
                transform: translateY(1px); 
                background-color: #006600;  /* Even darker green on click */ 
            } 
            .modal button:disabled { 
                background-color: #333; 
                border-color: #555; 
                color: #888; 
                cursor: not-allowed; 
                transform: none; 
            } 
            #level-up-modal .upgrade-option { 
                background-color: #0d0d0d;  /* Game world background for options */ 
                border: 1px solid #00cc00;  /* Green border */ 
                margin-bottom: 10px; 
                display: block; /* Stack buttons vertically */
                width: 100%;
                box-sizing: border-box;
            } 
            #level-up-modal .upgrade-option:hover { 
                background-color: #1a1a1a;  /* Darker on hover */ 
                border-color: #00ff00;  /* Brighter green border */ 
            } 
            
            /* --- UI Buttons (Mute & Pause) --- */
            #mute-button { 
                position: fixed; 
                bottom: 20px; 
                right: 20px; 
                z-index: 1001;  /* Above stats bar, below modal */ 
                width: 27px; /* 33% smaller */
                height: 27px; /* 33% smaller */
                font-size: 1rem;  /* 33% smaller */
                line-height: 27px;  /* 33% smaller */
                padding: 0; 
                text-align: center;  /* Hacker theme styling (borrowed from .modal button) */ 
                background-color: #008800;  /* Dark green button */ 
                color: white;  /* White text/emoji */ 
                border: 1px solid #00ff00;  /* Green button border */ 
                border-radius: 5px; 
                cursor: pointer; 
                transition: background-color 0.2s, transform 0.1s; 
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); 
                font-family: 'Consolas', 'Courier New', monospace; 
            } 
            #mute-button:hover { 
                background-color: #00cc00;  /* Brighter green on hover */ 
                transform: translateY(-2px); 
            } 
            #mute-button:active { 
                transform: translateY(1px); 
                background-color: #006600;  /* Even darker green on click */ 
            } 
            #mute-button.muted { 
                background-color: #333; 
                border-color: #555; 
                color: #888; 
            } 
            
            /* --- MODIFIED: Pause Button --- */
            #pause-button-ui {
                position: fixed;
                bottom: 20px; /* Moved to bottom */
                right: 57px; /* Placed beside mute button (20px + 27px + 10px margin) */
                z-index: 1001;
                width: 27px; /* 33% smaller */
                height: 27px; /* 33% smaller */
                font-size: 1rem; /* 33% smaller */
                font-weight: bold;
                line-height: 27px; /* 33% smaller */
                padding: 0;
                text-align: center;
                background-color: #008800;
                color: white;
                border: 1px solid #00ff00;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.2s, transform 0.1s;
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
                font-family: 'Consolas', 'Courier New', monospace;
            }
            #pause-button-ui:hover {
                background-color: #00cc00;
                transform: translateY(-2px);
            }
            #pause-button-ui:active {
                transform: translateY(1px);
                background-color: #006600;
            }
            /* Removed media query as it's no longer needed */

            /* --- Start Screen Ad --- */
            #start-screen-ad { 
                max-width: 90%;  /* Don't let it touch the modal edges */ 
                height: auto; 
                margin: 20px 0;  /* Add some vertical space */ 
                border: 2px solid #00ff00;  /* Green border */ 
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);  /* Green glow */ 
                image-rendering: pixelated;  /* Keep pixel art crisp */ 
            } 
            
            /* --- Top Icons --- */
            div.top-icons { 
                position: fixed; 
                top: 15px; 
                right: 15px; 
                display: flex; 
                z-index: 4101; 
            }
            div.top-icons img {
                height: 30px;
                display: block;
                margin-left: 5px;
            }
            @media (max-width: 600px) {
                div.top-icons {
                    /* This might be too crowded, but let's hide it */
                    /* Or move it */
                    /* top: 75px; */ /* <-- Removed this line to keep it top right */
                }
            }

            /* --- NEW: Extra Life (Comp) UI Icon --- */
            #extra-life-icon {
                position: fixed;
                top: 15px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1001; /* Above UI bar, below modals */
                width: 30px;
                height: 30px;
                image-rendering: pixelated;
                filter: drop-shadow(0 0 8px #ffff00);
                display: none; /* Hidden by default */
            }

            /* --- NEW: Virtual Joystick --- */
            #joystick-container {
                position: fixed;
                bottom: 30px;
                left: 30px;
                z-index: 1500;
                display: none; /* Hidden on desktop */
            }
            #joystick-base {
                position: relative;
                width: 120px;
                height: 120px;
                background: rgba(0, 255, 0, 0.1);
                border: 2px solid rgba(0, 255, 0, 0.4);
                border-radius: 50%;
            }
            #joystick-stick {
                position: absolute;
                width: 60px;
                height: 60px;
                background: rgba(0, 255, 0, 0.4);
                border: 2px solid rgba(0, 255, 0, 0.8);
                border-radius: 50%;
                left: 30px; /* (120 - 60) / 2 */
                top: 30px; /* (120 - 60) / 2 */
                transform: translate(0, 0); /* JS will modify this */
                transition: transform 0.05s linear;
            }
            
            /* Media query to show joystick only on touch devices */
            @media (pointer: coarse) {
                #joystick-container {
                    display: block;
                }
                /* Hide keyboard-only pause instructions */
                #pause-modal p.keyboard-only {
                    display: none;
                }
            }
            
        </style>         
    </head>     
    <body> 
        <div id="game-world"> 
            <img id="player" src="https://nekron.org/pics/sickkittys.gif" alt="Player Character"> 
            <div id="sonar"></div>             
        </div>         
        <div id="ui-container"> 
            <div id="stats-bar"> 
                <div> 
                    <div class="bar-label">HP</div>                     
                    <div class="bar" id="hp-bar"> 
                        <div id="hp-bar-fill"></div>                         
                    </div>                     
                </div>                 
                <div style="text-align: center;"> 
                    <div id="timer">00:00</div>                     
                    <div id="level">Level: 1</div>                     
                </div>                 
                <div> 
                    <div class="bar-label">XP</div>                     
                    <div class="bar" id="xp-bar"> 
                        <div id="xp-bar-fill"></div>                         
                    </div>                     
                </div>                 
            </div>             
        </div>         
        <div id="modal-container"> 
            <div id="start-modal" class="modal"> 
                <img src="https://www.nekron.org/pics/sickkittyad.gif" alt="Sick Kitty Ad" id="start-screen-ad"> 
                <p id="loading-text">Loading assets...</p> 
                <button id="start-button" disabled>Loading...</button>                 
            </div>             
            <div id="level-up-modal" class="modal hidden"> 
                <h1>UPGRADE AVAILABLE</h1> 
                <p>Select new directive:</p> 
                <button id="upgrade-opt-1" class="upgrade-option">Upgrade 1</button>                         
                <button id="upgrade-opt-2" class="upgrade-option">Upgrade 2</button>                         
                <button id="upgrade-opt-3" class="upgrade-option">Upgrade 3</button>                         
            </div>             
            <div id="game-over-modal" class="modal hidden"> 
                <h1>CRITICAL FAILURE</h1> 
                <p id="final-survival-time">System terminated after: 00:00</p> 
                <p id="final-level">Achieved System Level: 1</p> 
                <button id="restart-button">Reboot Game</button>                         
            </div>             
            <div id="pause-modal" class="modal hidden"> 
                <h1>GAME PAUSED</h1> 
                <p>System integrity nominal. Awaiting user input.</p> 
                <p class="keyboard-only">Press 'P' to resume.</p>
                <button id="resume-button">Resume Execution</button>                         
            </div>             
        </div>         
        <button id="mute-button">🔊</button>
        <button id="pause-button-ui">||</button>
        
        <div id="joystick-container">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <img id="extra-life-icon" src="https://www.nekron.org/pics/comp.gif" alt="Extra Life">

        <div class="top-icons"> 
            <a href="https://www.nekron.org/"><img src="https://www.nekron.org/hawk.png" alt="Hawk Icon"></a> 
            <a href="https://www.nekron.org/vec"><img src="https://www.nekron.org/squid.gif" alt="Squid Icon"></a> 
            <a href="https://www.nekron.org/wavenabber"><img src="https://www.nekron.org/ggsm.png" alt="GGSM Icon"></a> 
            <a href="https://www.nekron.org/radar.html"><img src="https://www.nekron.org/moths.png" alt="Moths Icon"></a> 
        </div>         
        
        <div id="screen-flash"></div>
        
        <audio id="background-music" loop> 
            <source src="https://www.nekron.org/music/lovescars.mp3" type="audio/mpeg"> 
        </audio>         
        
        <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- DOM Elements ---
            const gameWorld = document.getElementById('game-world');
            const player = document.getElementById('player');
            const sonar = document.getElementById('sonar');
            
            // UI
            const hpBarFill = document.getElementById('hp-bar-fill');
            const xpBarFill = document.getElementById('xp-bar-fill');
            const levelUI = document.getElementById('level');
            const timerUI = document.getElementById('timer');
            const extraLifeIconUI = document.getElementById('extra-life-icon'); // --- NEW ---

            // Modals
            const modalContainer = document.getElementById('modal-container');
            const startModal = document.getElementById('start-modal');
            const levelUpModal = document.getElementById('level-up-modal');
            const gameOverModal = document.getElementById('game-over-modal');
            const pauseModal = document.getElementById('pause-modal');
            
            // Buttons
            const startButton = document.getElementById('start-button');
            const restartButton = document.getElementById('restart-button');
            const resumeButton = document.getElementById('resume-button');
            const loadingText = document.getElementById('loading-text');
            const upgradeButtons = [
                document.getElementById('upgrade-opt-1'),
                document.getElementById('upgrade-opt-2'),
                document.getElementById('upgrade-opt-3')
            ];

            // Audio
            const backgroundMusic = document.getElementById('background-music');
            const muteButton = document.getElementById('mute-button');
            
            // --- Mobile Controls ---
            const pauseButtonUI = document.getElementById('pause-button-ui');
            const joystickContainer = document.getElementById('joystick-container');
            const joystickStick = document.getElementById('joystick-stick');
            
            // --- Game Configuration ---
            const CONFIG = {
                player: {
                    src: 'https://nekron.org/pics/sickkittys.gif',
                    speed: 200, // pixels per second
                    baseHp: 100,
                    hitCooldown: 1000, // ms of invincibility after hit
                    hitboxInset: 5 // 5px inset from all sides for player
                },
                xp: {
                    baseNextLevel: 10,
                    levelMultiplier: 1.4
                },
                enemy: {
                    baseSpawnInterval: 1000, // ms
                    minSpawnInterval: 100,
                    spawnIntervalDecay: 0.5, // % decay per level
                    hpScale: 1.1, // 10% more hp per player level (was 1.2)
                    speedScale: 1.02, // 2% faster per player level
                    types: [
                        { // Level 1 enemy (the bat)
                            id: 'bat1',
                            src: 'https://www.nekron.org/pics/bat.gif',
                            width: 48,
                            height: 32,
                            baseHp: 10,
                            baseSpeed: 70,
                            baseDamage: 10,
                            minLevel: 1,
                            hitboxInset: 10 // 10px inset
                        },
                        { // Level 2 enemy (the new bat)
                            id: 'bat2',
                            src: 'https://www.nekron.org/pics/bat2.gif',
                            width: 48, // Assuming same size
                            height: 32, // Assuming same size
                            baseHp: 20, // Stronger
                            baseSpeed: 80, // Faster
                            baseDamage: 15, // Hits harder
                            minLevel: 2, // Spawns at player level 2+
                            hitboxInset: 10 // 10px inset
                        },

                    { // Level 3 enemy (the new ghost)
                        id: 'ghost',

            // --- Game Loop ---
            function gameLoop(timestamp) {
                if (isPaused) {
                    if (pendingLevelUps > 0) {
                        isPaused = true; // Ensure pause
                        showLevelUpModal();
                        pendingLevelUps--;
                    }
                    return;
                }
                
                const deltaTime = (timestamp - lastLoopTime) / 1000; // seconds
                lastLoopTime = timestamp;

                // --- Update Functions ---
                updatePlayer(deltaTime);
                updateEnemies(deltaTime);
                updateWeapons(deltaTime, timestamp);
                updatePowerUps(deltaTime); 
                
                // --- Spawn Functions ---
                spawnEnemies(deltaTime);
                // --- REMOVED checkSpecialSpawns(deltaTime); ---
                
                // --- UI Update ---
                updateTimer(timestamp);

                // --- Next Frame ---
                requestAnimationFrame(gameLoop);
            }

            // --- Update Logic ---
            
		function updatePlayer(deltaTime) {
                let moveX = 0; // This will be the directional vector (-1 to 1)
                let moveY = 0;

                if (joystick.active) {
                    moveX = joystick.dx;
                    moveY = joystick.dy; // <-- ADD THIS LINE
                } else {
                    // Use keyboard input
                    if (keys['w'] || keys['ArrowUp']) moveY -= 1;
                    if (keys['s'] || keys['ArrowDown']) moveY += 1;
                    if (keys['a'] || keys['ArrowLeft']) moveX -= 1;
                    if (keys['d'] || keys['ArrowRight']) moveX += 1;
                }

                let finalDx = 0;
                let finalDy = 0;

                if (moveX !== 0 || moveY !== 0) {
                    if (joystick.active) {
                         // Joystick dx/dy are already scaled from -1 to 1 based on stick position
                        finalDx = moveX * playerState.speed * deltaTime;
                        finalDy = moveY * playerState.speed * deltaTime;
                    } else {
                        // Keyboard logic (normalize for diagonal)
                        const kbd_magnitude = Math.sqrt(moveX * moveX + moveY * moveY);
                        finalDx = (moveX / kbd_magnitude) * playerState.speed * deltaTime;
                        finalDy = (moveY / kbd_magnitude) * playerState.speed * deltaTime;
                    }
                }

                playerState.x += finalDx;
                playerState.y += finalDy;

                // Clamp player to screen
                playerState.x = Math.max(0, Math.min(window.innerWidth - playerState.width, playerState.x));
                playerState.y = Math.max(0, Math.min(window.innerHeight - playerState.height, playerState.y));

                // --- START MODIFICATION: Player Flip ---
                // Update player facing direction based on horizontal input
                if (moveX > 0) {
                    playerState.facingRight = true;
                } else if (moveX < 0) {
                    playerState.facingRight = false;
                }
                // If moveX is 0, we keep the last facing direction.

                // Apply the transform for flipping
                if (playerState.facingRight) {
                    player.style.transform = 'scaleX(1)'; // Default, facing right
                } else {
                    player.style.transform = 'scaleX(-1)'; // Flipped, facing left
                }
                // --- END MODIFICATION ---

                // Update player position
                player.style.left = `${playerState.x}px`;
                player.style.top = `${playerState.y}px`;

                // Make sonar follow player
                const playerCenterX = playerState.x + playerState.width / 2;
                const playerCenterY = playerState.y + playerState.height / 2;
                sonar.style.left = `${playerCenterX}px`;
                sonar.style.top = `${playerCenterY}px`;

                // Check collisions
                checkCollisions();
            }
            
            function updateEnemies(deltaTime) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];

                    if (enemy.slowTimer > 0) {
                        enemy.slowTimer -= deltaTime * 1000;
                        if (enemy.slowTimer <= 0) {
                            enemy.speed = enemy.originalSpeed;
                            enemy.element.style.filter = 'drop-shadow(0 0 5px #ff0000)'; // Reset
                        }
                    }
                    
                    // Move towards player
                    const dx = (playerState.x + playerState.width / 2) - (enemy.x + enemy.width / 2);
                    const dy = (playerState.y + playerState.height / 2) - (enemy.y + enemy.height / 2);
                    const magnitude = Math.sqrt(dx * dx + dy * dy);
                    
                    if (magnitude > 0) {
                        enemy.x += (dx / magnitude) * enemy.speed * deltaTime;
                        enemy.y += (dy / magnitude) * enemy.speed * deltaTime;
                    }
                    
                    enemy.element.style.left = `${enemy.x}px`;
                    enemy.element.style.top = `${enemy.y}px`;
                }
            }
            
            function updatePowerUps(deltaTime) {
                if (playerState.xpMultiplierTimer > 0) {
                    playerState.xpMultiplierTimer -= deltaTime * 1000;
                    
                    if (playerState.xpMultiplierTimer <= 0) {
                        playerState.xpMultiplier = 1;
                        playerState.xpMultiplierTimer = 0;
                        document.getElementById('xp-bar').classList.remove('boosted');
                    }
                }
            }

            function updateWeapons(deltaTime, timestamp) {
                const playerCenterX = playerState.x + playerState.width / 2;
                const playerCenterY = playerState.y + playerState.height / 2;

                // 1. Sonar
                const sonarStats = weapons.sonar;
                if (sonarStats.level > 0) {
                    sonar.style.width = `${sonarStats.size}px`;
                    sonar.style.height = `${sonarStats.size}px`;

                    // Damage tick logic
                    if (timestamp - sonarStats.lastTick > sonarStats.tick) {
                        sonarStats.lastTick = timestamp;
                        const sonarRadius = sonarStats.size / 2;

                        enemies.forEach(enemy => {
                            const enemyCenterX = enemy.x + enemy.width / 2;
                            const enemyCenterY = enemy.y + enemy.height / 2;
                            const dx = playerCenterX - enemyCenterX;
                            const dy = playerCenterY - enemyCenterY;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < sonarRadius + (enemy.width / 2)) { 
                                takeDamage(enemy, sonarStats.damage, 'sonar');
                            }
                        });
                    }
                }
                
                // 2. Spinning Orbs
                const orbStats = weapons.spinningOrbs;
                if (orbStats.count > 0) {
                    orbStats.angle += orbStats.speed * deltaTime;
                    
                    for (let i = 0; i < orbStats.count; i++) {
                        const orb = orbStats.orbs[i];
                        const angle = orbStats.angle + (i * (Math.PI * 2 / orbStats.count));
                        
                        orb.x = playerCenterX + (orbStats.radius * Math.cos(angle)) - (orb.element.offsetWidth / 2);
                        orb.y = playerCenterY + (orbStats.radius * Math.sin(angle)) - (orb.element.offsetHeight / 2);
                        
                        orb.element.style.left = `${orb.x}px`;
                        orb.element.style.top = `${orb.y}px`;

                        // Check orb collision
                        enemies.forEach(enemy => {
                            const enemyHitbox = {
                                x: enemy.x + enemy.hitboxInset,
                                y: enemy.y + enemy.hitboxInset,
                                width: enemy.width - (enemy.hitboxInset * 2),
                                height: enemy.height - (enemy.hitboxInset * 2)
                            };
                            if (isColliding(orb, enemyHitbox)) {
                                takeDamage(enemy, orbStats.damage, 'orb');
                            }
                        });
                    }
                }

                // 3. Flamethrower
                const flameStats = weapons.flamethrower;
                if (flameStats.level > 0) {
                    flameStats.element.style.display = 'block'; // Show it

                    // Aiming Logic
                    let closestEnemy = null;
                    let minDistance = Infinity;

                    enemies.forEach(enemy => {
                        const enemyCenterX = enemy.x + enemy.width / 2;
                        const enemyCenterY = enemy.y + enemy.height / 2;
                        const dx = enemyCenterX - playerCenterX;
                        const dy = enemyCenterY - playerCenterY;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < minDistance) {
                            minDistance = distance;
                            closestEnemy = enemy;
                        }
                    });

                    let aimAngle = 0; // Default: aim right
                    if (closestEnemy) {
                        const enemyCenterX = closestEnemy.x + closestEnemy.width / 2;
                        const enemyCenterY = closestEnemy.y + closestEnemy.height / 2;
                        aimAngle = Math.atan2(enemyCenterY - playerCenterY, enemyCenterX - playerCenterX);
                    }
                    
                    // Position and Rotate GIF
                    flameStats.element.style.left = `${playerCenterX}px`;
                    flameStats.element.style.top = `${playerCenterY - flameStats.element.offsetHeight / 2}px`;
                    flameStats.element.style.transform = `rotate(${aimAngle}rad)`;

                    // Damage Logic
                    if (timestamp - flameStats.lastTick > flameStats.tick) {
                        flameStats.lastTick = timestamp;

                        enemies.forEach(enemy => {
                            const enemyCenterX = enemy.x + enemy.width / 2;
                            const enemyCenterY = enemy.y + enemy.height / 2;
                            const dx = enemyCenterX - playerCenterX;
                            const dy = enemyCenterY - playerCenterY;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance > 0 && distance < (flameStats.range + enemy.width / 2)) {
                                const enemyAngle = Math.atan2(dy, dx);
                                let angleDiff = Math.abs(aimAngle - enemyAngle);
                                
                                if (angleDiff > Math.PI) {
                                    angleDiff = (Math.PI * 2) - angleDiff;
                                }

                                if (angleDiff <= flameStats.spread / 2) {
                                    takeDamage(enemy, flameStats.damage, 'flame');
                                }
                            }
                        });
                    }
                }
                
                // 4. Iceblast
                const iceStats = weapons.iceblast;
                if (iceStats.level > 0) {
                    // Fire projectile
                    if (timestamp - iceStats.lastTick > iceStats.tick) {
                        iceStats.lastTick = timestamp;
                        
                        // Aiming Logic (same as flamethrower)
                        let closestEnemy = null;
                        let minDistance = Infinity;
                        enemies.forEach(enemy => {
                            const enemyCenterX = enemy.x + enemy.width / 2;
                            const enemyCenterY = enemy.y + enemy.height / 2;
                            const dx = enemyCenterX - playerCenterX;
                            const dy = enemyCenterY - playerCenterY;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < minDistance) {
                                minDistance = distance;
                                closestEnemy = enemy;
                            }
                        });

                        if (closestEnemy) {
                            const enemyCenterX = closestEnemy.x + closestEnemy.width / 2;
                            const enemyCenterY = closestEnemy.y + closestEnemy.height / 2;
                            const aimAngle = Math.atan2(enemyCenterY - playerCenterY, enemyCenterX - playerCenterX);
                            createIceblastShard(playerCenterX, playerCenterY, aimAngle);
                        }
                    }

                    // Update existing projectiles
                    for (let i = iceStats.projectiles.length - 1; i >= 0; i--) {
                        const proj = iceStats.projectiles[i];
                        
                        // Move
                        proj.x += proj.dx * proj.speed * deltaTime;
                        proj.y += proj.dy * proj.speed * deltaTime;
                        proj.element.style.left = `${proj.x}px`;
                        proj.element.style.top = `${proj.y}px`;
                        
                        // Check collision
                        let hit = false;
                        for (const enemy of enemies) {
                            const enemyHitbox = {
                                x: enemy.x + enemy.hitboxInset,
                                y: enemy.y + enemy.hitboxInset,
                                width: enemy.width - (enemy.hitboxInset * 2),
                                height: enemy.height - (enemy.hitboxInset * 2)
                            };
                            
                            if (isColliding(proj, enemyHitbox)) {
                                takeDamage(enemy, proj.damage, 'iceblast');
                                applySlow(enemy); // Apply slow effect
                                proj.element.remove();
                                iceStats.projectiles.splice(i, 1);
                                hit = true;
                                break;
                            }
                        }
                        if (hit) continue;

                        // Check out of bounds
                        if (proj.x < -100 || proj.x > window.innerWidth + 100 || proj.y < -100 || proj.y > window.innerHeight + 100) {
                            proj.element.remove();
                            iceStats.projectiles.splice(i, 1);
                        }
                    }
                }
            }

            function updateTimer(timestamp) {
                const elapsed = Math.floor((timestamp - gameStats.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                timerUI.textContent = `${minutes}:${seconds}`;
            }

            // --- Spawning ---
            function spawnEnemies(deltaTime) {
                gameStats.enemySpawnTimer += deltaTime * 1000; // in ms
                
                if (gameStats.enemySpawnTimer > gameStats.currentSpawnInterval) {
                    gameStats.enemySpawnTimer = 0;
                    
                    // Spawn location
                    const edge = Math.floor(Math.random() * 4);
                    let x, y;
                    const buffer = 50; // spawn 50px off-screen

                    if (edge === 0) { // Top
                        x = Math.random() * window.innerWidth;
                        y = -buffer;
                    } else if (edge === 1) { // Right
                        x = window.innerWidth + buffer;
                        y = Math.random() * window.innerHeight;
                    } else if (edge === 2) { // Bottom
                        x = Math.random() * window.innerWidth;
                        y = window.innerHeight + buffer;
                    } else { // Left
                        x = -buffer;
                        y = Math.random() * window.innerHeight;
                    }
                    
                    // Boss Spawn Logic
                    if (gameStats.bossSpawnPending && gameStats.pendingBossId) {
                        const bossType = CONFIG.enemy.types.find(t => t.id === gameStats.pendingBossId);
                        if (bossType) {
                            // --- Spawn one or multiple bosses based on gameStats ---
                            for (let i = 0; i < gameStats.bossSpawnCount; i++) {
                                // Spawn them slightly offset from each other
                                const offsetX = (Math.random() - 0.5) * 80; // 80px offset
                                const offsetY = (Math.random() - 0.5) * 80;
                                createEnemy(x + offsetX, y + offsetY, bossType);
                            }
                            
                            gameStats.bossSpawnPending = false; // Reset flags
                            gameStats.pendingBossId = null;
                        }
                    }

                    // 1. Get list of available NON-BOSS enemies
                    // --- START MODIFICATION ---
                    const availableEnemies = CONFIG.enemy.types.filter(type => {
                        // NEW: Special check for spiders
                        if (type.id === 'spider' && !gameStats.orangeBossDefeated) {
                            return false; // Do not spawn spiders until orange boss is defeated
                        }
                        
                        // Original check
                        return playerState.level >= type.minLevel && 
                               !type.isBoss; // Exclude boss from regular spawns
                    });
                    // --- END MODIFICATION ---

                    if (availableEnemies.length === 0) return; // No enemies to spawn

                    // 2. Pick one enemy type to spawn this interval
                    const enemyType = availableEnemies[Math.floor(Math.random() * availableEnemies.length)];
                    
                    // 3. Spawn the chosen enemy (or swarm)
                    if (enemyType) {
                        if (enemyType.id === 'spider') {
                            // "a lot of them" (Swarm Logic)
                            const count = 3 + Math.floor(Math.random() * 3); // Spawn 3-5 spiders
                            for (let i = 0; i < count; i++) {
                                // Spawn them slightly offset from each other
                                const offsetX = (Math.random() - 0.5) * 60;
                                const offsetY = (Math.random() - 0.5) * 60;
                                createEnemy(x + offsetX, y + offsetY, enemyType);
                            }
                        } else {
                            // Standard spawn
                            createEnemy(x, y, enemyType);
                        }
                    }
                }
            }

            // --- Collision & Damage ---
            function isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            function checkCollisions() {
                const playerHitbox = { 
                    x: playerState.x + playerState.hitboxInset, 
                    y: playerState.y + playerState.hitboxInset, 
                    width: playerState.width - (playerState.hitboxInset * 2), 
                    height: playerState.height - (playerState.hitboxInset * 2) 
                };

                // Player vs Enemy
                if (!playerInvincible) {
                    for (const enemy of enemies.values()) {
                        const enemyHitbox = { 
                            x: enemy.x + enemy.hitboxInset, 
                            y: enemy.y + enemy.hitboxInset, 
                            width: enemy.width - (enemy.hitboxInset * 2), 
                            height: enemy.height - (enemy.hitboxInset * 2) 
                        };
                        
                        if (isColliding(playerHitbox, enemyHitbox)) {
                            playerHit(enemy.damage);
                            break; 
                        }
                    }
                }
                
                // Player vs XP Gem
                const playerPickupRect = { 
                    x: playerState.x, 
                    y: playerState.y, 
                    width: playerState.width, 
                    height: playerState.height 
                };
                for (let i = xpGems.length - 1; i >= 0; i--) {
                    const gem = xpGems[i];
                    const gemRect = { x: gem.x, y: gem.y, width: gem.width, height: gem.height };
                    if (isColliding(playerPickupRect, gemRect)) {
                        collectXP(gem.value);
                        gem.element.remove();
                        xpGems.splice(i, 1);
                    }
                }

                // Player vs XP Boost
                for (let i = xpBoosts.length - 1; i >= 0; i--) {
                    const boost = xpBoosts[i];
                    const boostRect = { x: boost.x, y: boost.y, width: boost.width, height: boost.height };
                    if (isColliding(playerPickupRect, boostRect)) {
                        activateXPBoost();
                        boost.element.remove();
                        xpBoosts.splice(i, 1);
                    }
                }

                // Player vs Health Pack
                for (let i = healthPacks.length - 1; i >= 0; i--) {
                    const pack = healthPacks[i];
                    const packRect = { x: pack.x, y: pack.y, width: pack.width, height: pack.height };
                    if (isColliding(playerPickupRect, packRect)) {
                        activateHealthPack();
                        pack.element.remove();
                        healthPacks.splice(i, 1);
                    }
                }

                // Player vs Bom
                for (let i = boms.length - 1; i >= 0; i--) {
                    const bom = boms[i];
                    const bomRect = { x: bom.x, y: bom.y, width: bom.width, height: bom.height };
                    if (isColliding(playerPickupRect, bomRect)) {
                        activateBom();
                        bom.element.remove();
                        boms.splice(i, 1);
                    }
                }

                // --- NEW: Player vs Flamethrower Pickup ---
                for (let i = flamethrowerPickups.length - 1; i >= 0; i--) {
                    const pickup = flamethrowerPickups[i];
                    const pickupRect = { x: pickup.x, y: pickup.y, width: pickup.width, height: pickup.height };
                    if (isColliding(playerPickupRect, pickupRect)) {
                        activateFlamethrowerWeapon();
                        pickup.element.remove();
                        flamethrowerPickups.splice(i, 1);
                    }
                }
                
                // Player vs Iceblast Pickup
                for (let i = iceblastPickups.length - 1; i >= 0; i--) {
                    const pickup = iceblastPickups[i];
                    const pickupRect = { x: pickup.x, y: pickup.y, width: pickup.width, height: pickup.height };
                    if (isColliding(playerPickupRect, pickupRect)) {
                        activateIceblastWeapon();
                        pickup.element.remove();
                        iceblastPickups.splice(i, 1);
                    }
                }

                // --- NEW: Player vs Extra Life Pickup ---
                for (let i = extraLifePickups.length - 1; i >= 0; i--) {
                    const pickup = extraLifePickups[i];
                    const pickupRect = { x: pickup.x, y: pickup.y, width: pickup.width, height: pickup.height };
                    if (isColliding(playerPickupRect, pickupRect)) {
                        activateExtraLife();
                        pickup.element.remove();
                        extraLifePickups.splice(i, 1);
                    }
                }
            }
            
            function playerHit(damage) {
                if (playerInvincible) return;
                
                playerState.hp -= damage;
                
                if (playerState.hp <= 0) {
                    // --- NEW: Extra Life Logic ---
                    if (playerHasExtraLife) {
                        playerHasExtraLife = false; // Use the life
                        extraLifeIconUI.style.display = 'none'; // Hide UI icon
                        playerState.hp = playerState.maxHp; // Full heal
                        
                        activateBom(); // Clear the screen
                        
                        // Grant invincibility
                        playerInvincible = true;
                        player.classList.add('taking-damage');
                        setTimeout(() => {
                            playerInvincible = false;
                            player.classList.remove('taking-damage');
                        }, CONFIG.player.hitCooldown * 2); // Double invincibility
                        
                        updateUI(); // Update HP bar
                        return; // Stop here, don't trigger game over
                    } else {
                        // --- Original Game Over ---
                        playerState.hp = 0; // Clamp HP
                        gameOver();
                    }
                } else {
                    playerInvincible = true;
                    player.classList.add('taking-damage');
                    setTimeout(() => {
                        playerInvincible = false;
                        player.classList.remove('taking-damage');
                    }, CONFIG.player.hitCooldown);
                }

                updateUI(); // Update UI after any hit
            }

            function takeDamage(enemy, damage, weaponType) {
                if (weaponType === 'orb') {
                    if (enemy.lastHitByOrb) return;
                    enemy.lastHitByOrb = true;
                    setTimeout(() => { enemy.lastHitByOrb = false; }, 500); 
                }

                if (weaponType === 'flame') {
                    if (enemy.lastHitByFlame) return;
                    enemy.lastHitByFlame = true; 
                    setTimeout(() => { enemy.lastHitByFlame = false; }, weapons.flamethrower.tick - 10); 
                }
                
                enemy.hp -= damage;
                createDamageNumber(damage, enemy.x + enemy.width / 2, enemy.y);

                if (enemy.enemyType && enemy.enemyType.isMultiStage && enemy.stage === 1) {
                    const hpPercent = enemy.hp / enemy.maxHp;
                    if (hpPercent <= enemy.enemyType.stage2Threshold) {
                        enemy.stage = 2;
                        enemy.originalSpeed = enemy.enemyType.baseSpeedStage2;
                        
                        if (enemy.slowTimer > 0) {
                            enemy.speed = enemy.originalSpeed * (1 - weapons.iceblast.slowAmount);
                        } else {
                            enemy.speed = enemy.originalSpeed;
                        }
                        
                        enemy.element.src = preloadedImages['orangeboss_s2'].src;
                    }
                }
                
                if (enemy.hp <= 0) {
                    createXPGem(enemy.x, enemy.y);

                    // --- START MODIFICATION ---
                    if (enemy.id === 'orangeboss') {
                        gameStats.orangeBossDefeated = true;
                    }
                    // --- END MODIFICATION ---

                    if (enemy.id === 'ghoul' || enemy.id === 'orangeboss' || enemy.id === 'bigspider') { // --- ADDED bigspider ---
                        createBom(enemy.x, enemy.y);
                    } else {
                        // Regular enemy drop logic
                        if (Math.random() < CONFIG.powerUps.xpBoost.dropChance) {
                            createXPBoost(enemy.x, enemy.y);
                        }
                        
                        if (Math.random() < CONFIG.powerUps.healthPack.dropChance) {
                            createHealthPack(enemy.x, enemy.y);
                        }

                        if (Math.random() < CONFIG.powerUps.bom.dropChance) {
                            createBom(enemy.x, enemy.y);
                        }

                        // --- NEW: Flamethrower Pickup Drop Logic ---
                        if (weapons.flamethrower.level === 0 && Math.random() < CONFIG.powerUps.flamethrowerPickup.dropChance) {
                            createFlamethrowerPickup(enemy.x, enemy.y);
                        }

                        // --- NEW: Iceblast Pickup Drop Logic ---
                        if (weapons.iceblast.level === 0 && Math.random() < CONFIG.powerUps.iceblastPickup.dropChance) {
                            createIceblastPickup(enemy.x, enemy.y);
                        }

                        // --- NEW: Extra Life Drop Logic ---
                        // Only spawn if player doesn't have one AND one isn't already on the ground
                        if (!playerHasExtraLife && extraLifePickups.length === 0 && Math.random() < CONFIG.powerUps.extraLife.dropChance) {
                            createExtraLife(enemy.x, enemy.y);
                        }
                    }

                    enemy.element.remove();
                    enemies = enemies.filter(e => e !== enemy);
                }
            }

            // --- XP & Leveling ---
            function collectXP(amount) {
                playerState.xp += (amount * playerState.xpMultiplier); 
                if (playerState.xp >= playerState.nextLevelXp) {
                    levelUp();
                }
                updateUI();
            }

            function activateXPBoost() {
                const config = CONFIG.powerUps.xpBoost;
                playerState.xpMultiplier = config.multiplier;
                playerState.xpMultiplierTimer = config.duration;
                document.getElementById('xp-bar').classList.add('boosted');

                playerState.hp = Math.min(playerState.maxHp, playerState.hp + config.healthRestore);

            }

            // --- NEW: Activate Flamethrower Weapon ---
            function activateFlamethrowerWeapon() {
                // Only activate if we don't have it
                if (weapons.flamethrower.level > 0) return; 

                const config = CONFIG.weapons.flamethrower;
                weapons.flamethrower = {
                    level: 1,
                    damage: config.baseDamage,
                    range: config.baseRange,
                    spread: config.baseSpread,

                };
                weapons.flamethrower.element.className = 'flame-weapon';
