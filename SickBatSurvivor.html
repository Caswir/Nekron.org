            function activateIceblastWeapon() {
                weapons.iceblast.level = 1;
            }
            
            // --- NEW: Activate Extra Life ---
            function activateExtraLife() {
                if (playerHasExtraLife) return; // Should be impossible due to spawn logic, but good failsafe
                playerHasExtraLife = true;
                extraLifeIconUI.style.display = 'block';
            }
            
            function applySlow(enemy) {
                const iceStats = weapons.iceblast;
                enemy.slowTimer = iceStats.slowDuration;
                enemy.speed = enemy.originalSpeed * (1 - iceStats.slowAmount);
                enemy.element.style.filter = 'drop-shadow(0 0 10px #00ffff) brightness(0.7)'; // Cyan glow
            }

            // --- NEW: Screen Flash Function ---
            function flashScreen(count, interval) {
                if (count <= 0) return;

                const screenFlash = document.getElementById('screen-flash');
                if (!screenFlash) return; // Safety check

                // Flash ON
                screenFlash.style.display = 'block';

                setTimeout(() => {
                    // Flash OFF
                    screenFlash.style.display = 'none';

                    setTimeout(() => {
                        // Recurse for next flash
                        flashScreen(count - 1, interval);
                    }, interval / 2); // Wait for half interval before next flash

                }, interval / 2); // Wait for half interval
            }

            function activateBom() {
                // --- NEW: Screen Flash Effect ---
                flashScreen(3, 80); // 3 flashes, 80ms total cycle time (40ms on, 40ms off)

                // 1. Kill all NON-BOSS enemies and make them drop XP
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    
                    // Check if the enemy is a boss
                    if (enemy.enemyType && enemy.enemyType.isBoss) {
                        continue; // Skip this enemy, it's a boss
                    }
                    
                    createXPGem(enemy.x, enemy.y); // Drop XP
                    enemy.element.remove();
                    enemies.splice(i, 1);
                }

                // 2. Collect all XP at once
                for (let i = xpGems.length - 1; i >= 0; i--) {
                    const gem = xpGems[i];
                    collectXP(gem.value); // Add XP to player
                    gem.element.remove();
                    xpGems.splice(i, 1);
                }

                // --- REMOVED Old Boss Spawn Trigger ---
            }

            function levelUp() {
                isPaused = true;
                playerState.level++;
                playerState.xp = playerState.xp - playerState.nextLevelXp; // Rollover
                playerState.nextLevelXp = Math.floor(CONFIG.xp.baseNextLevel * Math.pow(CONFIG.xp.levelMultiplier, playerState.level - 1));
                
                playerState.hp = Math.min(playerState.maxHp, playerState.hp + 20);
                
                gameStats.currentSpawnInterval = Math.max(CONFIG.enemy.minSpawnInterval, 
                    CONFIG.enemy.baseSpawnInterval * Math.pow(1 - (CONFIG.enemy.spawnIntervalDecay / 100), playerState.level - 1));

                // --- NEW Boss Rotation Logic ---
                // Triggers at level 8, 11, 14, 17, 20...
                if (playerState.level >= 8 && (playerState.level - 8) % 3 === 0) {
                    
                    // --- Check if we should upgrade to double bosses ---
                    // We've completed the first rotation (8, 11, 14). At level 17, start doubles.
                    if (playerState.level === 17) {
                        gameStats.bossSpawnCount = 2;
                    }

                    // --- MODIFICATION: Swapped bigspider and orangeboss ---
                    // The rotation: Ghoul -> Orange Boss -> Big Spider -> repeat
                    const bossRotation = ['ghoul', 'orangeboss', 'bigspider'];
                    
                    // Get the boss for this level
                    const bossIdToSpawn = bossRotation[gameStats.bossSpawnIndex];
                    
                    // Set the flags for the spawnEnemies function
                    gameStats.pendingBossId = bossIdToSpawn;
                    gameStats.bossSpawnPending = true;
                    
                    // Increment and wrap the index for the *next* boss spawn
                    gameStats.bossSpawnIndex = (gameStats.bossSpawnIndex + 1) % bossRotation.length;
                }
                
                // --- REMOVED iceblastSpawnTimer logic ---
                
                pendingLevelUps++;
                updateUI();
            }

            function showLevelUpModal() {
                const upgrades = getUpgradeOptions(3);
                
                upgradeButtons.forEach((button, index) => {
                    if (!upgrades[index]) {
                        button.textContent = "---";
                        const newButton = button.cloneNode(true);
                        button.parentNode.replaceChild(newButton, button);
                        newButton.disabled = true;
                        upgradeButtons[index] = newButton;
                        return;
                    }
                    const upgrade = upgrades[index];
                    button.textContent = upgrade.description;
                    const newButton = button.cloneNode(true);
                    button.parentNode.replaceChild(newButton, button);
                    newButton.addEventListener('click', () => applyUpgrade(upgrade));
                    upgradeButtons[index] = newButton; 
                    newButton.disabled = false; 
                });

                modalContainer.classList.remove('hidden');
                levelUpModal.classList.remove('hidden');
            }
            
            function getUpgradeOptions(count) {
                const options = [
                    // Sonar
                    { id: 'sonar_damage', description: `Sonar Damage +${CONFIG.weapons.sonar.damageScale}`, apply: () => weapons.sonar.damage += CONFIG.weapons.sonar.damageScale },
                    { id: 'sonar_size', description: `Sonar Range +${CONFIG.weapons.sonar.sizeScale}px`, apply: () => weapons.sonar.size += CONFIG.weapons.sonar.sizeScale },
                    { id: 'sonar_tick', description: `Sonar Frequency +${-CONFIG.weapons.sonar.tickScale}ms`, apply: () => weapons.sonar.tick = Math.max(100, weapons.sonar.tick + CONFIG.weapons.sonar.tickScale) },
                    
                    // Orbs
                    { id: 'orb_add', description: 'Deploy +1 Orbital Defender', apply: () => {
                        weapons.spinningOrbs.level++;
                        weapons.spinningOrbs.count += CONFIG.weapons.spinningOrbs.countScale;
                        createSpinningOrb();
                    }},
                    { id: 'orb_damage', description: `Orbital Damage +${CONFIG.weapons.spinningOrbs.damageScale}`, apply: () => weapons.spinningOrbs.damage += CONFIG.weapons.spinningOrbs.damageScale },
                    { id: 'orb_speed', description: `Orbital Velocity +${CONFIG.weapons.spinningOrbs.speedScale}`, apply: () => weapons.spinningOrbs.speed += CONFIG.weapons.spinningOrbs.speedScale },

                    // Flamethrower Upgrades
                    // --- REMOVED 'flame_add' OPTION ---
                    { id: 'flame_damage', description: `Flame Damage +${CONFIG.weapons.flamethrower.damageScale}`, apply: () => weapons.flamethrower.damage += CONFIG.weapons.flamethrower.damageScale },
                    { id: 'flame_range', description: `Flame Range +${CONFIG.weapons.flamethrower.rangeScale}px`, apply: () => weapons.flamethrower.range += CONFIG.weapons.flamethrower.rangeScale },
                    { id: 'flame_spread', description: `Flame Spread +${Math.round(CONFIG.weapons.flamethrower.spreadScale * 180 / Math.PI)}deg`, apply: () => weapons.flamethrower.spread += CONFIG.weapons.flamethrower.spreadScale },
                    { id: 'flame_tick', description: `Flame Frequency +${-CONFIG.weapons.flamethrower.tickScale}ms`, apply: () => weapons.flamethrower.tick = Math.max(100, weapons.flamethrower.tick + CONFIG.weapons.flamethrower.tickScale) },

                    // --- NEW: Iceblast Upgrades ---
                    { id: 'ice_damage', description: `Iceblast Damage +${CONFIG.weapons.iceblast.damageScale}`, apply: () => weapons.iceblast.damage += CONFIG.weapons.iceblast.damageScale },
                    { id: 'ice_speed', description: `Iceblast Speed +${CONFIG.weapons.iceblast.speedScale}`, apply: () => weapons.iceblast.speed += CONFIG.weapons.iceblast.speedScale },
                    { id: 'ice_tick', description: `Iceblast Frequency +${-CONFIG.weapons.iceblast.tickScale}ms`, apply: () => weapons.iceblast.tick = Math.max(200, weapons.iceblast.tick + CONFIG.weapons.iceblast.tickScale) },

                    // Player
                    { id: 'player_speed', description: 'Boost Speed (+20)', apply: () => playerState.speed += 20 },
                    { id: 'player_hp', description: 'Sandwich (+20 Max HP)', apply: () => {
                        playerState.maxHp += 20;
                        playerState.hp += 20; // Heal
                    }},
                    { id: 'player_heal', description: 'Cigarette (Heal 30% HP)', apply: () => playerState.hp = Math.min(playerState.maxHp, playerState.hp + playerState.maxHp * 0.3) },
                ];
                
                // Filter out upgrades
                let availableOptions = options.filter(opt => {
                    if (opt.id.startsWith('orb_') && opt.id !== 'orb_add' && weapons.spinningOrbs.level === 0) {
                        return false;
                    }
                    if (opt.id === 'orb_add' && weapons.spinningOrbs.count >= 4) { 
                        return false;
                    }
                    
                    // --- MODIFIED: Filter for Flamethrower ---
                    if (opt.id.startsWith('flame_') && weapons.flamethrower.level === 0) {
                        return false;
                    }
                    
                    // --- NEW: Filter for Iceblast ---
                    if (opt.id.startsWith('ice_') && weapons.iceblast.level === 0) {
                        return false;
                    }
                    
                    return true;
                });
                
                availableOptions.sort(() => 0.5 - Math.random());
                return availableOptions.slice(0, count);
            }
            
            function applyUpgrade(upgrade) {
                upgrade.apply();
                
                modalContainer.classList.add('hidden');
                levelUpModal.classList.add('hidden');
                
                updateUI();
                
                if (pendingLevelUps > 0) {
                    pendingLevelUps--;
                    showLevelUpModal();
                } else {
                    isPaused = false;
                    lastLoopTime = performance.now();
                    requestAnimationFrame(gameLoop);
                }
            }

            // --- Game State ---

            function togglePause() {
                if (!gameOverModal.classList.contains('hidden') || !levelUpModal.classList.contains('hidden')) {
                    return;
                }

                isPaused = !isPaused; 

                if (isPaused) {
                    modalContainer.classList.remove('hidden');
                    pauseModal.classList.remove('hidden');
                    backgroundMusic.pause(); 
                } else {
                    modalContainer.classList.add('hidden');
                    pauseModal.classList.add('hidden');
                    
                    if (!isMuted && audioInitialized) {
                         backgroundMusic.play().catch(e => console.warn("Music play failed:", e));
                    }
                    
                    lastLoopTime = performance.now();
                    requestAnimationFrame(gameLoop);
                }
            }

            function gameOver() {
                isPaused = true;
                
                document.getElementById('final-survival-time').textContent = `System terminated after: ${timerUI.textContent}`;
                document.getElementById('final-level').textContent = `Achieved System Level: ${playerState.level}`;
                
                modalContainer.classList.remove('hidden');
                gameOverModal.classList.remove('hidden');

                backgroundMusic.pause();
                backgroundMusic.currentTime = 0; 
            }

            function updateUI() {
                const hpPercent = (playerState.hp / playerState.maxHp) * 100;
                hpBarFill.style.width = `${hpPercent}%`;
                
                const xpPercent = (playerState.xp / playerState.nextLevelXp) * 100;
                xpBarFill.style.width = `${xpPercent}%`;
                
                levelUI.textContent = `Level: ${playerState.level}`;
            }

            // --- Event Listeners ---
            
            // Keyboard Input
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (e.key.toLowerCase() === 'p') {
                    togglePause();
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });
            
            // Button Clicks
            startButton.addEventListener('click', () => {
                initializeGame();
                audioInitialized = true; 
                if (!isMuted) {
                    backgroundMusic.play().catch(e => console.warn("Music autoplay blocked:", e));
                }
            });
            
            restartButton.addEventListener('click', () => {
                initializeGame();
                if (!isMuted && audioInitialized) {
                    backgroundMusic.play().catch(e => console.warn("Music play failed:", e));
                }
            });

            resumeButton.addEventListener('click', togglePause);
            
            pauseButtonUI.addEventListener('click', togglePause);

            // Mute Button
            muteButton.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    backgroundMusic.pause();
                    muteButton.textContent = '🔇';
                    muteButton.classList.add('muted');
                } else {
                    muteButton.textContent = '🔊';
                    muteButton.classList.remove('muted');
                    
                    const gameIsActive = startModal.classList.contains('hidden') && 
                                         gameOverModal.classList.contains('hidden');
                                         
                    if (gameIsActive && audioInitialized && !isPaused) { 
                        backgroundMusic.play().catch(e => console.warn("Music play failed:", e));
                    }
                }
            });
            
            // --- Joystick Touch Listeners ---
            function handleTouchStart(e) {
                // Only act on touches starting on the joystick base
                const touch = e.changedTouches[0];
                if (!joystickContainer) return; // Guard clause
                const joystickBaseRect = joystickContainer.getBoundingClientRect();

                // Check if touch is within the general *container* area
                // --- FIX: Corrected joystickBaseR to joystickBaseRect ---
                if (touch.clientX >= joystickBaseRect.left && touch.clientX <= joystickBaseRect.right &&
                    touch.clientY >= joystickBaseRect.top && touch.clientY <= joystickBaseRect.bottom) {
                    
                    e.preventDefault();
                    if (joystick.active) return; // Already tracking a touch

                    joystick.active = true;
                    joystick.touchId = touch.identifier;
                    
                    // Center of the BASE element
                    joystick.baseX = joystickBaseRect.left + joystickBaseRect.width / 2;
                    joystick.baseY = joystickBaseRect.top + joystickBaseRect.height / 2;
                    
                    // Manually call move to handle the first press
                    handleTouchMove(e);
                }
            }

            function handleTouchMove(e) {
                if (!joystick.active) return;

                let touch = null;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystick.touchId) {
                        touch = e.changedTouches[i];
                        break;
                    }
                }

                if (!touch) return; // Not our touch
                e.preventDefault(); // Prevent scrolling
                
                if (!joystickContainer || !joystickStick) return; // Guard clauses

                const joystickBaseRect = joystickContainer.getBoundingClientRect();
                const maxDistance = joystickBaseRect.width / 2; // Radius of the base

                let stickX = touch.clientX - joystick.baseX;
                let stickY = touch.clientY - joystick.baseY;
                let distance = Math.sqrt(stickX * stickX + stickY * stickY);

                if (distance > maxDistance) {
                    stickX = (stickX / distance) * maxDistance;
                    stickY = (stickY / distance) * maxDistance;
                }

                joystickStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

                // Set scaled direction vector for game loop
                joystick.dx = stickX / maxDistance;
                joystick.dy = stickY / maxDistance;
            }

            function handleTouchEnd(e) {
                if (!joystick.active) return;

                let touchEnded = false;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystick.touchId) {
                        touchEnded = true;
                        break;
                    }
                }

                if (touchEnded) {
                    e.preventDefault();
                    joystick.active = false;
                    joystick.touchId = null;
                    joystick.dx = 0;
                    joystick.dy = 0;
                    if (joystickStick) {
                        joystickStick.style.transform = 'translate(0, 0)';
                    }
                }
            }
            
            // --- START PRELOADING ---
            preloadImages(() => {
                console.log("All assets loaded.");
                loadingText.textContent = "Based off of Sick Kitty Vampire #3028.";
                startButton.disabled = false;
                startButton.textContent = "Execute Program";
            });

            // --- Fix potential null reference on joystick script error ---
            // Check for joystick elements before adding listeners
            if (joystickContainer) {
                window.addEventListener('touchstart', handleTouchStart, { passive: false });
                window.addEventListener('touchmove', handleTouchMove, { passive: false });
                window.addEventListener('touchend', handleTouchEnd, { passive: false });
                window.addEventListener('touchcancel', handleTouchEnd, { passive: false });
            } else {
                console.warn("Joystick container not found. Touch controls disabled.");
            }


        });
    </script>         
    </body>
